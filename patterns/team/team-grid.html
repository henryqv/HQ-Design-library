<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HQ Design Library — Professional Team Grid</title>
<style>
:root{
--color-background:#f7f6f2;--color-surface:#fff;--color-text:#1b1b1b;
--color-muted:#6b6b67;--color-primary:#1f3a4a;--color-accent:#a47c48;
--color-border:#ddd9d0;--font-display:Georgia,"Times New Roman",serif;
--font-body:Inter,Arial,sans-serif;--space-content:clamp(1rem,4vw,3rem);
--space-section:clamp(4rem,9vw,8rem);--radius-card:8px
}
*{box-sizing:border-box}body{margin:0;background:var(--color-background);color:var(--color-text);font-family:var(--font-body);line-height:1.5}
a{color:inherit}.preview{max-width:1200px;margin:auto}.preview__header{padding:1rem var(--space-content);border-bottom:1px solid var(--color-border);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="preview">
<header class="preview__header"><strong>HQ Design Library</strong><span>Professional Team Grid</span></header>
<main><section class="c-team" aria-labelledby="team-title">
  <div class="c-team__intro">
    <p class="c-eyebrow">Our people</p>
    <h2 id="team-title">The people behind the work.</h2>
  </div>
  <div class="c-team__grid">
    <article class="c-person"><div class="c-person__image"></div><h3>Name Surname</h3><p>Partner / Director</p></article>
    <article class="c-person"><div class="c-person__image"></div><h3>Name Surname</h3><p>Senior Associate</p></article>
    <article class="c-person"><div class="c-person__image"></div><h3>Name Surname</h3><p>Consultant</p></article>
  </div>
</section></main>
</div>
</body>
</html>

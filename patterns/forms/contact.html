<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HQ Design Library — Accessible Contact Form</title>
<style>
:root{
--color-background:#f7f6f2;--color-surface:#fff;--color-text:#1b1b1b;
--color-muted:#6b6b67;--color-primary:#1f3a4a;--color-accent:#a47c48;
--color-border:#ddd9d0;--font-display:Georgia,"Times New Roman",serif;
--font-body:Inter,Arial,sans-serif;--space-content:clamp(1rem,4vw,3rem);
--space-section:clamp(4rem,9vw,8rem);--radius-card:8px
}
*{box-sizing:border-box}body{margin:0;background:var(--color-background);color:var(--color-text);font-family:var(--font-body);line-height:1.5}
a{color:inherit}.preview{max-width:1200px;margin:auto}.preview__header{padding:1rem var(--space-content);border-bottom:1px solid var(--color-border);display:flex;justify-content:space-between}
</style>
</head>
<body>
<div class="preview">
<header class="preview__header"><strong>HQ Design Library</strong><span>Accessible Contact Form</span></header>
<main><form class="c-form">
  <div class="c-form__field">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" autocomplete="name" required>
  </div>
  <div class="c-form__field">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
  </div>
  <div class="c-form__field">
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6"></textarea>
  </div>
  <button class="c-button c-button--primary" type="submit">Send</button>
</form></main>
</div>
</body>
</html>
